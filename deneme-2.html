<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Örneği</title>
  <link rel="stylesheet" href="deneme-2.css">
</head>
<body>
<div class="container">
  <h1>Üye Ol</h1>
  <form>
    <!-- İsim Girişi -->
    <label for="name">Adınız:</label>
    <input type="text" id="name" name="name" placeholder="Adınızı girin">

    <!-- Email Girişi -->
    <label for="email">E-posta:</label>
    <input type="email" id="email" name="email" placeholder="E-posta adresinizi girin">

    <!-- Cinsiyet Seçimi -->
    <fieldset>
      <legend>Cinsiyet:</legend>
      <label>
        <input type="radio" name="gender" value="male"> Erkek
      </label>
      <label>
        <input type="radio" name="gender" value="female"> Kadın
      </label>
      <label>
        <input type="radio" name="gender" value="other"> Diğer
      </label>
    </fieldset>

    <!-- İlgi Alanları -->
    <label for="interests">İlgi Alanlarınız:</label>
    <input type="text" id="interests" name="interests" placeholder="Ör: Teknoloji, Spor">

    <!-- Gönder ve Temizle Butonları -->
    <div class="buttons">
      <button type="submit">Gönder</button>
      <button type="reset">Temizle</button>
    </div>
  </form>
</div>
</body>
</html>
